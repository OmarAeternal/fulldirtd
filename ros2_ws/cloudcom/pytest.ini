[pytest]
# backup/ berisi salinan file lama dengan nama modul yang sama — kalau ikut
# dikumpulkan, pytest menolak jalan karena bentrok nama. .venv dilewati karena
# isinya pustaka pihak ketiga, bukan tes proyek ini.
norecursedirs = backup .venv out __pycache__ .pytest_cache tes data

# Tes yang menjalankan registrasi utuh — lambat, tapi tetap ikut secara default
# karena justru itu yang membuktikan pipeline-nya bekerja. Lewati dengan:
#     pytest -m "not slow"
markers =
    slow: registrasi utuh, hitungannya berat
